[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "textforge-python"
dynamic = ["version"]
description = "Typed Python bindings for TextForge text-transformation pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/redlintles/textforge-python"
Issues = "https://github.com/redlintles/textforge-python/issues"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "twine>=6"]

[tool.maturin]
python-source = "python"
module-name = "textforge._native"
features = ["extension-module"]
include = [{ path = "scripts/**", format = "sdist" }, { path = "tests/**", format = "sdist" }, { path = "docs/**", format = "sdist" }, { path = "vendor/CORE_REVISION", format = "sdist" }]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
