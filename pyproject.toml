[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "textforgers"
dynamic = ["version"]
description = "Typed Python bindings for TextForge text-transformation pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/redlintles/textforge-python"
Issues = "https://github.com/redlintles/textforge-python/issues"
Changelog = "https://github.com/redlintles/textforge-python/blob/main/Changelog.md"

[dependency-groups]
dev = [
  "maturin==1.16.0",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "build==1.6.1",
  "twine==7.0.0",
]

[tool.maturin]
python-source = "python"
module-name = "textforge._native"
features = ["extension-module"]
include = [
  { path = "Changelog.md", format = "sdist" },
  { path = "scripts/**", format = "sdist" },
  { path = "tests/**", format = "sdist" },
  { path = "docs/**", format = "sdist" },
  { path = "vendor/CORE_REVISION", format = "sdist" },
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
