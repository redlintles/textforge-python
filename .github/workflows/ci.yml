name: Python bindings

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      destination:
        description: Package index (publishing requires environment approval)
        type: choice
        default: none
        options: [none, testpypi, pypi]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install maturin pytest ruff mypy
      - run: maturin build --locked --out dist
      - run: python -m pip install --no-index --find-links dist textforgers
      - run: python scripts/check.py

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          manylinux: auto
      - run: python -m pip install pytest
      - run: python -m pip install --no-index --find-links dist textforgers
      - run: python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  python-versions:
    runs-on: ubuntu-latest
    needs: wheels
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist
      - run: python -m pip install pytest
      - run: python -m pip install --no-index --find-links dist textforgers
      - run: python -m pytest

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin pytest twine
      - run: maturin sdist --out dist
      - run: python -m twine check dist/*
      - name: Rebuild and test outside the checkout
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/sdist-check"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-check"
          cd "$RUNNER_TEMP"/sdist-check/textforgers-*
          maturin build --release --locked --out wheels
          python -m pip install --no-index --find-links wheels textforgers
          python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.destination != 'none'
    needs: [quality, wheels, python-versions, sdist]
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: inputs.destination == 'testpypi'
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: inputs.destination == 'pypi'
