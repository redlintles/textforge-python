[package]
name = "textforgers"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Typed Python bindings for the TextForge text-processing DSL"
license = "GPL-3.0-only"
repository = "https://github.com/redlintles/textforge-python"
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
textforge = { path = "vendor/textforge", features = ["bytecode", "watchers", "buffered"] }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]
# Test-only reference executable; never enabled for distributed Python wheels.
test-reference = ["textforge/test_access"]

[workspace]

[[example]]
name = "builder_reference"
required-features = ["test-reference"]

[[example]]
name = "processor_reference"
required-features = ["test-reference"]
